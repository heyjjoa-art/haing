<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>새 유닛 추가 - Journeys</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <h1>Journeys 📘</h1>
  <p class="subtitle" id="pageSubtitle">새 유닛 추가</p>
</header>

<main>

  <section class="card">
    <p class="field-label">레벨</p>
    <input type="text" id="levelInput" placeholder="예: 1.1">

    <p class="field-label">제목</p>
    <input type="text" id="titleInput" placeholder="예: The Big Wave">

    <p class="field-label">본문 사진 (여러 장 가능)</p>
    <p class="hint">책 페이지를 순서대로 한 장씩, 또는 여러 장을 한 번에 선택하세요. 순서는 ▲▼로 바꿀 수 있어요.</p>
    <label class="file-btn">
      사진 추가
      <input type="file" id="photoInput" accept="image/*" multiple hidden>
    </label>
    <div class="photo-grid" id="photoGrid"></div>

    <p class="upload-actions">
      <button type="button" id="ocrBtn" class="secondary-btn" disabled>🔎 새로 추가한 페이지 텍스트 인식하기</button>
    </p>
    <p class="ocr-status" id="ocrStatus"></p>

    <p class="field-label">본문 텍스트</p>
    <p class="hint">인식 결과가 틀리면 직접 고쳐주세요. 문단 사이는 빈 줄로 구분해요.</p>
    <textarea id="textInput" rows="12" placeholder="여기에 본문이 나타나요. 인식이 안 됐으면 직접 입력해도 돼요."></textarea>

    <p class="save-status" id="saveStatus"></p>
    <div class="upload-actions">
      <button type="button" id="saveBtn" class="file-btn">💾 저장하기</button>
      <button type="button" id="deleteBtn" class="danger-btn" hidden>🗑 이 유닛 삭제</button>
    </div>
  </section>

  <p class="back-link"><a href="index.html" id="backLink">← 목록으로</a></p>

</main>

<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="js/data-store.js"></script>
<script src="js/add.js"></script>
</body>
</html>
