<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>읽기 - Journeys</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/reader.css">
</head>
<body>

<main class="reader-main">

  <section class="story-page">
    <div class="reader-sticky-top">
      <p class="listen-note">지금 읽는 부분이 노란색으로 표시돼요.<br>모르는 단어는 톡 눌러보세요!</p>

      <div class="mode-actions" id="modeActions">
        <button type="button" id="listenBtn" class="listen-btn listen"><span class="listen-btn-icon">🔊</span><span class="listen-btn-label">음원 듣기</span></button>
        <button type="button" id="followBtn" class="listen-btn follow"><span class="listen-btn-icon">✨</span><span class="listen-btn-label">따라 읽기</span></button>
        <button type="button" id="aloneBtn" class="listen-btn alone"><span class="listen-btn-icon">📖</span><span class="listen-btn-label">혼자 읽기</span></button>
      </div>
    </div>

    <h2 class="story-title" id="storyTitleEl"></h2>

    <div class="page-photo-wrap" id="pagePhotoWrap" hidden>
      <img id="pagePhotoImg" class="page-photo-img" alt="">
      <span class="story-photo-badge" id="pagePhotoBadge"></span>
    </div>

    <div class="story-text" id="storyTextArea"></div>

    <div class="page-nav" id="pageNav" hidden>
      <button type="button" id="prevPageBtn" class="page-nav-btn">◀ 이전 페이지</button>
      <span class="page-nav-indicator" id="pageIndicator">1 / 1</span>
      <button type="button" id="nextPageBtn" class="page-nav-btn">다음 페이지 ▶</button>
    </div>
  </section>

  <p class="back-link"><a href="index.html" id="backLink">← 목록으로</a></p>

</main>

<div class="word-popup" id="wordPopup">
  <div class="word-popup-body">
    <span class="word-popup-word" id="wordPopupWord"></span>
    <span class="word-popup-meaning" id="wordPopupMeaning"></span>
    <span class="word-popup-en" id="wordPopupEn"></span>
  </div>
  <button type="button" class="word-popup-close" id="wordPopupClose">✕</button>
</div>

<div class="reward-modal" id="rewardModal" hidden>
  <div class="reward-card">
    <span class="reward-sparkle">✨ 🔮 ✨</span>
    <p class="reward-title">오늘의 미션 완성!</p>
    <p class="reward-zodiac" id="rewardZodiac"></p>
    <p class="reward-heading">✧ 오늘의 운세 ✧</p>
    <p class="reward-text" id="rewardText"></p>
    <div class="reward-lucky-row">
      <span class="reward-lucky-chip" id="rewardLuckyColor"></span>
      <span class="reward-lucky-chip" id="rewardLuckyNumber"></span>
    </div>
    <button type="button" class="reward-close-btn" id="rewardCloseBtn">확인</button>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js"></script>
<script src="../js/words-data.js"></script>
<script src="../js/child-store.js"></script>
<script src="../js/fortune-store.js"></script>
<script src="js/tts.js"></script>
<script src="js/data-store.js"></script>
<script src="js/stamp-store.js"></script>
<script src="js/dictionary.js"></script>
<script src="../js/word-card-store.js"></script>
<script src="../js/word-game-store.js"></script>
<script src="js/reader.js"></script>
</body>
</html>
