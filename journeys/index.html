<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Journeys - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202608271414">
<link rel="stylesheet" href="css/reader.css?v=202608271414">
</head>
<body>

<main>

  <div class="reader-top-row" id="topStampSpeedRow" hidden>
    <section class="stamp-board" id="stampBoard">
      <h3 class="stamp-board-title">🗓 이번주 미션도장</h3>
      <div class="stamp-board-weeks" id="stampBoardWeeks"></div>
    </section>
  </div>

  <p class="empty-state" id="emptyState" hidden>
    아직 등록된 유닛이 없어요.
  </p>

  <nav class="level-tabs" id="levelTabs" role="tablist"></nav>

  <div id="levelList"></div>

  <p class="back-link" id="backLink"><a href="../index.html">← Haing 홈으로</a></p>

</main>

<script>
  // 관리자 탭(?admin=1)에서 열렸을 때만 수정/삭제, 새 유닛 추가 버튼을 보여준다.
  // Journeys 탭에서 그냥 읽으러 왔을 때는 아이들이 실수로 지우지 않도록 숨긴다.
  // home.js가 이 값을 읽어서 카드에 관리 버튼을 넣을지 정하므로, home.js보다 먼저 실행돼야 한다.
  window.JOURNEYS_ADMIN_MODE = new URLSearchParams(location.search).get("admin") === "1";

  function applyAdminMode() {
    if (window.self !== window.top) {
      document.getElementById("backLink").hidden = true;
    }
    if (window.JOURNEYS_ADMIN_MODE && window.__journeysRenderHome) window.__journeysRenderHome();
  }
  applyAdminMode();

  // iframe으로 열렸을 때 일부 브라우저 환경에서 iframe src의 쿼리스트링(?admin=1)이
  // 유지되지 않는 경우를 대비해, 부모 창이 보내는 메시지로도 관리자 모드를 켤 수 있게 한다.
  window.addEventListener("message", function (event) {
    if (event.origin !== window.location.origin) return;
    if (event.data && event.data.type === "haing:journeys-admin-mode" && !window.JOURNEYS_ADMIN_MODE) {
      window.JOURNEYS_ADMIN_MODE = true;
      applyAdminMode();
    }
  });
</script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js?v=202608271414"></script>
<script src="../js/child-store.js?v=202608271414"></script>
<script src="js/data-store.js?v=202608271414"></script>
<script src="js/stamp-store.js?v=202608271414"></script>
<script src="js/home.js?v=202608271414"></script>
</body>
</html>
