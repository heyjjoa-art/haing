<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스네이크 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202609111255">
<link rel="stylesheet" href="css/game-ui.css?v=202609111255">
<link rel="stylesheet" href="css/snake.css?v=202609111255">
</head>
<body>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle" id="appSubtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="game-main">
  <h2 class="game-title">🐍 스네이크</h2>

  <div class="stage-tabs">
    <button type="button" class="stage-tab active" id="snakeEasyTab" data-difficulty="easy">🟢 쉬움</button>
    <button type="button" class="stage-tab" id="snakeNormalTab" data-difficulty="normal">🟡 보통</button>
    <button type="button" class="stage-tab" id="snakeHardTab" data-difficulty="hard">🔴 어려움</button>
  </div>

  <div class="game-stats">
    <span class="game-stat--credits">🎮 기회 <strong id="snakeCredits">0</strong>회</span>
    <span class="game-stat--best">🏆 최고 <strong id="snakeBest">0</strong></span>
    <span>점수 <strong id="snakeScore">0</strong></span>
  </div>

  <div class="snake-board-wrap">
    <canvas id="snakeBoard" class="snake-board" width="320" height="320"></canvas>
    <button type="button" class="game-icon-btn" id="snakePauseBtn" aria-label="일시정지">⏸</button>
    <div class="game-veil" id="snakePauseVeil" hidden>⏸ 일시정지</div>
  </div>

  <div class="game-pad">
    <div class="game-dpad">
      <button type="button" class="game-dpad-btn game-dpad-up" id="snakeUpBtn" aria-label="위로">▲</button>
      <button type="button" class="game-dpad-btn game-dpad-left" id="snakeLeftBtn" aria-label="왼쪽으로">◀</button>
      <button type="button" class="game-dpad-btn game-dpad-right" id="snakeRightBtn" aria-label="오른쪽으로">▶</button>
      <button type="button" class="game-dpad-btn game-dpad-down" id="snakeDownBtn" aria-label="아래로">▼</button>
    </div>
  </div>

  <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>

  <div class="game-overlay" id="snakeOverlay" hidden>
    <div class="game-overlay-box">
      <p class="game-overlay-title">게임 오버!</p>
      <p class="game-overlay-desc" id="snakeOverlayScore"></p>
      <button type="button" class="game-btn game-btn--primary" id="snakeRetryBtn">🔄 다시 하기</button>
      <p class="game-overlay-note" id="snakeOverlayNote" hidden>게임 기회를 모두 썼어요! 트로피 카드나 별 스티커를 더 모으면 기회가 또 생겨요.</p>
      <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js?v=202609111255"></script>
<script src="js/child-store.js?v=202609111255"></script>
<script src="js/admin-auth-store.js?v=202609111255"></script>
<script src="js/growth-store.js?v=202609111255"></script>
<script src="js/child-badge.js?v=202609111255"></script>
<script src="js/word-card-store.js?v=202609111255"></script>
<script src="js/progress-store.js?v=202609111255"></script>
<script src="journeys/js/stamp-store.js?v=202609111255"></script>
<script src="js/word-game-store.js?v=202609111255"></script>
<script src="js/snake.js?v=202609111255"></script>
</body>
</html>
