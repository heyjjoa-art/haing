<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해피피 찾기 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202608261345">
<link rel="stylesheet" href="css/smileyfind.css?v=202608261345">
</head>
<body>

<!-- 관리자 계정에서만 개발/테스트하는 게임 - 아직 아이 계정에는 열지 않는다.
     관리자로 로그인돼 있지 않으면 바로 홈으로 돌려보낸다(js/smileyfind-gate.js). -->
<script src="js/admin-auth-store.js?v=202608261345"></script>
<script src="js/smileyfind-gate.js?v=202608261345"></script>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="sf-main">
  <p class="sf-dev-badge">🛠️ 개발 중 - 관리자 전용 (아직 아이 계정에는 안 보여요)</p>

  <p class="sf-best">🏆 나의 최고 기록 <strong id="sfBest">-</strong> · ⏱ <strong id="sfTimer">0:00</strong></p>

  <div class="stage-tabs">
    <button type="button" class="stage-tab active" id="sfEasyTab" data-level="easy">🟢 쉬운 단계</button>
    <button type="button" class="stage-tab" id="sfMediumTab" data-level="medium">🟡 중간 단계</button>
    <button type="button" class="stage-tab" id="sfHardTab" data-level="hard">🔴 어려운 단계</button>
  </div>

  <p class="sf-status">
    <span>🙂 남은 스마일 <strong id="sfRemaining">0</strong>개</span>
  </p>

  <div class="sf-board" id="sfBoard"></div>

  <div class="sf-mode-row">
    <button type="button" class="sf-mode-btn active" id="sfRevealModeBtn">🔍 열기 모드</button>
    <button type="button" class="sf-mode-btn" id="sfFlagModeBtn">🚩 표시 모드</button>
  </div>
  <p class="sf-mode-hint">표시 모드에서 칸을 누르면(또는 마우스 오른쪽 클릭하면) "스마일이 있을 것 같은 칸"에 깃발을 꽂아둘 수 있어요.</p>

  <p class="back-link"><a href="index.html">← 홈으로</a></p>

  <div class="sf-overlay" id="sfOverlay" hidden>
    <div class="sf-overlay-box">
      <p class="sf-overlay-title" id="sfOverlayTitle">🎉 모두 찾았어요!</p>
      <p class="sf-overlay-desc" id="sfOverlayDesc"></p>
      <button type="button" class="wc-popup-btn" id="sfRetryBtn">🔄 새 판</button>
      <p class="back-link"><a href="index.html">← 홈으로</a></p>
    </div>
  </div>
</main>

<script src="js/child-store.js?v=202608261345"></script>
<script src="js/smileyfind.js?v=202608261345"></script>
</body>
</html>
