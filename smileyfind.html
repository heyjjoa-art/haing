<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>해피피 찾기 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202609161454">
<link rel="stylesheet" href="css/game-ui.css?v=202609161454">
<link rel="stylesheet" href="css/smileyfind.css?v=202609161454">
</head>
<body>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle" id="appSubtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="game-main">
  <h2 class="game-title">🙂 해피피 찾기</h2>

  <p class="sf-level-line">레벨 <strong id="sfLevelNum">1</strong> / <span id="sfLevelTotal">3</span></p>

  <div class="stage-select-wrap">
    <label class="stage-select-label" for="sfLevelSelect">레벨 선택</label>
    <select class="stage-select" id="sfLevelSelect"></select>
  </div>

  <div class="game-stats">
    <span class="game-stat--credits">🎮 기회 <strong id="sfCredits">0</strong>회</span>
    <span class="game-stat--best">🏆 최고 <strong id="sfBest">-</strong></span>
    <span>⏱ <strong id="sfTimer">0:00</strong></span>
  </div>

  <p class="sf-status">
    <span>🙂 남은 스마일 <strong id="sfRemaining">0</strong>개</span>
  </p>

  <div class="sf-board" id="sfBoard"></div>

  <div class="sf-mode-row">
    <button type="button" class="sf-mode-btn active" id="sfRevealModeBtn">🔍 열기 모드</button>
    <button type="button" class="sf-mode-btn" id="sfFlagModeBtn">🚩 표시 모드</button>
  </div>
  <p class="sf-mode-hint">표시 모드에서 칸을 누르면(또는 마우스 오른쪽 클릭하면) "스마일이 있을 것 같은 칸"에 깃발을 꽂아둘 수 있어요.</p>

  <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>

  <div class="game-overlay" id="sfOverlay" hidden>
    <div class="game-overlay-box">
      <p class="game-overlay-title" id="sfOverlayTitle">🎉 모두 찾았어요!</p>
      <p class="game-overlay-desc" id="sfOverlayDesc"></p>
      <button type="button" class="game-btn game-btn--primary" id="sfNextBtn" hidden>➡️ 다음 레벨</button>
      <button type="button" class="game-btn" id="sfRetryBtn">🔄 새 판</button>
      <p class="game-overlay-note" id="sfOverlayNote" hidden>게임 기회를 모두 썼어요! 트로피 카드나 별 스티커를 더 모으면 기회가 또 생겨요.</p>
      <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js?v=202609161454"></script>
<script src="js/child-store.js?v=202609161454"></script>
<script src="js/admin-auth-store.js?v=202609161454"></script>
<script src="js/growth-store.js?v=202609161454"></script>
<script src="js/child-badge.js?v=202609161454"></script>
<script src="js/word-card-store.js?v=202609161454"></script>
<script src="js/progress-store.js?v=202609161454"></script>
<script src="journeys/js/stamp-store.js?v=202609161454"></script>
<script src="js/word-game-store.js?v=202609161454"></script>
<script src="js/smileyfind.js?v=202609161454"></script>
</body>
</html>
