<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>청기백기 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202609031317">
<link rel="stylesheet" href="css/game-ui.css?v=202609031317">
<link rel="stylesheet" href="css/flag.css?v=202609031317">
</head>
<body>

<!-- 관리자 계정에서만 개발/테스트하는 게임 - 아직 아이 계정에는 열지 않는다.
     관리자로 로그인돼 있지 않으면 바로 홈으로 돌려보낸다(js/flag-gate.js). -->
<script src="js/admin-auth-store.js?v=202609031317"></script>
<script src="js/flag-gate.js?v=202609031317"></script>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle" id="appSubtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="game-main">
  <p class="game-dev-badge">🛠️ 개발 중 - 관리자 전용 (아직 아이 계정에는 안 보여요)</p>
  <h2 class="game-title">🚩 청기백기</h2>

  <p class="flg-level-line">레벨 <strong id="flgLevelNum">1</strong> / <span id="flgLevelTotal">10</span></p>

  <div class="stage-tabs stage-tabs--levels" id="flgLevelPicker"></div>

  <div class="game-stats">
    <span class="game-stat--best">🏆 최고 점수 <strong id="flgBest">-</strong></span>
    <span>목숨 <strong id="flgLives">❤️❤️❤️</strong></span>
    <span>점수 <strong id="flgScore">0</strong></span>
  </div>

  <p class="flg-progress" id="flgProgress">0 / 10</p>

  <div class="flg-stage">
    <div class="flg-timerbar-wrap"><div class="flg-timerbar" id="flgTimerBar"></div></div>
    <p class="flg-command" id="flgCommand">준비하세요!</p>
    <p class="flg-feedback" id="flgFeedback" aria-live="polite"></p>

    <div class="flg-flags">
      <button type="button" class="flg-flag-btn" id="flgBlueBtn" aria-label="청기 올리기/내리기">
        <svg class="flg-flag-svg" viewBox="0 0 60 100" aria-hidden="true">
          <rect x="27" y="6" width="5" height="88" rx="2" fill="#8a5a34"/>
          <rect class="flg-flag-cloth" id="flgBlueCloth" x="32" y="10" width="26" height="18" rx="2" fill="#2f6fed"/>
        </svg>
        <span class="flg-flag-label">청기</span>
        <span class="flg-flag-state" id="flgBlueState">내림</span>
      </button>
      <button type="button" class="flg-flag-btn" id="flgWhiteBtn" aria-label="백기 올리기/내리기">
        <svg class="flg-flag-svg" viewBox="0 0 60 100" aria-hidden="true">
          <rect x="27" y="6" width="5" height="88" rx="2" fill="#8a5a34"/>
          <rect class="flg-flag-cloth" id="flgWhiteCloth" x="32" y="10" width="26" height="18" rx="2" fill="#f5f0e6" stroke="#c9bfae" stroke-width="1.5"/>
        </svg>
        <span class="flg-flag-label">백기</span>
        <span class="flg-flag-state" id="flgWhiteState">내림</span>
      </button>
    </div>
  </div>

  <p class="flg-hint" id="flgHint">글자와 소리로 명령이 나와요. 깃발을 눌러서 올리고 내려요 - 언급 안 된 깃발은 그대로 둬야 해요!</p>

  <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>

  <div class="game-overlay" id="flgOverlay" hidden>
    <div class="game-overlay-box">
      <p class="game-overlay-title" id="flgOverlayTitle"></p>
      <p class="game-overlay-desc" id="flgOverlayDesc"></p>
      <button type="button" class="game-btn game-btn--primary" id="flgNextBtn" hidden>➡️ 다음 레벨</button>
      <button type="button" class="game-btn" id="flgRetryBtn">🔄 같은 레벨 다시</button>
      <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>
    </div>
  </div>
</main>

<script src="js/child-store.js?v=202609031317"></script>
<script src="js/flag.js?v=202609031317"></script>
</body>
</html>
