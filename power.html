<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>구구단 스네이크 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202608281120">
<link rel="stylesheet" href="css/game-ui.css?v=202608281120">
<link rel="stylesheet" href="css/power.css?v=202608281120">
</head>
<body>

<!-- 관리자 계정에서만 개발/테스트하는 게임 - 아직 아이 계정에는 열지 않는다.
     관리자로 로그인돼 있지 않으면 바로 홈으로 돌려보낸다(js/power-gate.js). -->
<script src="js/admin-auth-store.js?v=202608281120"></script>
<script src="js/power-gate.js?v=202608281120"></script>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle" id="appSubtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="game-main">
  <p class="game-dev-badge">🛠️ 개발 중 - 관리자 전용 (아직 아이 계정에는 안 보여요)</p>
  <h2 class="game-title">🐍 구구단 스네이크</h2>

  <p class="pow-level-line">레벨 <strong id="powLevelNum">1</strong> / <span id="powLevelTotal">19</span> · <strong id="powBaseNum">2</strong>단</p>

  <div class="stage-select-wrap" id="powLevelChoice">
    <label class="stage-select-label" for="powLevelSelect">레벨 선택</label>
    <select class="stage-select" id="powLevelSelect"></select>
  </div>

  <div class="game-stats">
    <span class="game-stat--best">🏆 최고 기록 <strong id="powBest">-</strong></span>
    <span>⏱ <strong id="powTimer">0:00</strong></span>
    <span>점수 <strong id="powScore">0</strong></span>
  </div>

  <p class="pow-hint" id="powHint">구구단 숫자만 순서대로 먹어보세요! 다른 숫자를 먹으면 게임이 끝나요.</p>

  <div class="pow-board-wrap">
    <canvas id="powBoard" class="pow-board" width="320" height="320"></canvas>
    <div class="pow-top-bar">
      <div class="pow-target-badge" id="powTargetBadge">2×1</div>
      <button type="button" class="game-icon-btn" id="powPauseBtn" aria-label="일시정지">⏸</button>
    </div>
    <div class="game-veil" id="powPauseVeil" hidden>⏸ 일시정지</div>
  </div>

  <div class="game-pad">
    <div class="game-dpad">
      <button type="button" class="game-dpad-btn game-dpad-up" id="powUpBtn" aria-label="위로">▲</button>
      <button type="button" class="game-dpad-btn game-dpad-left" id="powLeftBtn" aria-label="왼쪽으로">◀</button>
      <button type="button" class="game-dpad-btn game-dpad-right" id="powRightBtn" aria-label="오른쪽으로">▶</button>
      <button type="button" class="game-dpad-btn game-dpad-down" id="powDownBtn" aria-label="아래로">▼</button>
    </div>
  </div>

  <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>

  <div class="game-overlay" id="powOverlay" hidden>
    <div class="game-overlay-box">
      <p class="game-overlay-title" id="powOverlayTitle"></p>
      <p class="game-overlay-desc" id="powOverlayDesc"></p>
      <button type="button" class="game-btn game-btn--primary" id="powNextBtn" hidden>➡️ 다음 단계</button>
      <button type="button" class="game-btn" id="powRetryBtn">🔄 같은 단계 다시</button>
      <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>
    </div>
  </div>
</main>

<script src="js/child-store.js?v=202608281120"></script>
<script src="js/power.js?v=202608281120"></script>
</body>
</html>
