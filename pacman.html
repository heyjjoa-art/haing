<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팩맨 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202608281321">
<link rel="stylesheet" href="css/game-ui.css?v=202608281321">
<link rel="stylesheet" href="css/pacman.css?v=202608281321">
</head>
<body>

<!-- 관리자 계정에서만 개발/테스트하는 게임 - 아직 아이 계정에는 열지 않는다.
     관리자로 로그인돼 있지 않으면 바로 홈으로 돌려보낸다(js/pacman-gate.js). -->
<script src="js/admin-auth-store.js?v=202608281321"></script>
<script src="js/pacman-gate.js?v=202608281321"></script>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle" id="appSubtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="game-main">
  <p class="game-dev-badge">🛠️ 개발 중 - 관리자 전용 (아직 아이 계정에는 안 보여요)</p>
  <h2 class="game-title">👻 팩맨</h2>

  <p class="pac-level-line">레벨 <strong id="pacLevelNum">1</strong> / <span id="pacLevelTotal">3</span></p>

  <div class="stage-select-wrap">
    <label class="stage-select-label" for="pacLevelSelect">레벨 선택</label>
    <select class="stage-select" id="pacLevelSelect"></select>
  </div>

  <div class="game-stats">
    <span class="game-stat--best">🏆 최고 <strong id="pacBest">0</strong></span>
    <span>점수 <strong id="pacScore">0</strong></span>
    <span>기회 <strong id="pacLives">3</strong></span>
  </div>

  <div class="pac-board-wrap">
    <canvas id="pacBoard" class="pac-board" width="320" height="320"></canvas>
    <button type="button" class="game-icon-btn" id="pacPauseBtn" aria-label="일시정지">⏸</button>
    <div class="game-veil" id="pacPauseVeil" hidden>⏸ 일시정지</div>
  </div>

  <div class="game-pad">
    <div class="game-dpad">
      <button type="button" class="game-dpad-btn game-dpad-up" id="pacUpBtn" aria-label="위로">▲</button>
      <button type="button" class="game-dpad-btn game-dpad-left" id="pacLeftBtn" aria-label="왼쪽으로">◀</button>
      <button type="button" class="game-dpad-btn game-dpad-right" id="pacRightBtn" aria-label="오른쪽으로">▶</button>
      <button type="button" class="game-dpad-btn game-dpad-down" id="pacDownBtn" aria-label="아래로">▼</button>
    </div>
  </div>

  <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>

  <div class="game-overlay" id="pacOverlay" hidden>
    <div class="game-overlay-box">
      <p class="game-overlay-title" id="pacOverlayTitle">게임 오버!</p>
      <p class="game-overlay-desc" id="pacOverlayScore"></p>
      <button type="button" class="game-btn game-btn--primary" id="pacNextBtn" hidden>➡️ 다음 레벨</button>
      <button type="button" class="game-btn" id="pacRetryBtn">🔄 다시 하기</button>
      <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>
    </div>
  </div>
</main>

<script src="js/child-store.js?v=202608281321"></script>
<script src="js/game-ui.js?v=202608281321"></script>
<script src="js/pacman.js?v=202608281321"></script>
</body>
</html>
