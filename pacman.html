<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>팩맨 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202608261345">
<link rel="stylesheet" href="css/pacman.css?v=202608261345">
</head>
<body>

<!-- 관리자 계정에서만 개발/테스트하는 게임 - 아직 아이 계정에는 열지 않는다.
     관리자로 로그인돼 있지 않으면 바로 홈으로 돌려보낸다(js/pacman-gate.js). -->
<script src="js/admin-auth-store.js?v=202608261345"></script>
<script src="js/pacman-gate.js?v=202608261345"></script>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="pac-main">
  <p class="pac-dev-badge">🛠️ 개발 중 - 관리자 전용 (아직 아이 계정에는 안 보여요)</p>

  <p class="pac-best">🏆 나의 최고 점수 <strong id="pacBest">0</strong></p>

  <div class="stage-tabs">
    <button type="button" class="stage-tab active" id="pacEasyTab" data-difficulty="easy">🟢 쉬움</button>
    <button type="button" class="stage-tab" id="pacNormalTab" data-difficulty="normal">🟡 보통</button>
    <button type="button" class="stage-tab" id="pacHardTab" data-difficulty="hard">🔴 어려움</button>
  </div>

  <div class="pac-stats">
    <span>점수 <strong id="pacScore">0</strong></span>
    <span>기회 <strong id="pacLives">3</strong></span>
  </div>

  <div class="pac-board-wrap">
    <canvas id="pacBoard" class="pac-board" width="320" height="320"></canvas>
    <button type="button" class="secondary-btn pac-pause-btn" id="pacPauseBtn" aria-label="일시정지">⏸</button>
    <div class="pac-pause-veil" id="pacPauseVeil" hidden>⏸ 일시정지</div>
  </div>

  <div class="pac-dpad-row">
    <div class="pac-dpad">
      <button type="button" class="pac-btn pac-dpad-up" id="pacUpBtn" aria-label="위로">▲</button>
      <button type="button" class="pac-btn pac-dpad-left" id="pacLeftBtn" aria-label="왼쪽으로">◀</button>
      <button type="button" class="pac-btn pac-dpad-right" id="pacRightBtn" aria-label="오른쪽으로">▶</button>
      <button type="button" class="pac-btn pac-dpad-down" id="pacDownBtn" aria-label="아래로">▼</button>
    </div>
  </div>

  <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록으로</a></p>

  <div class="pac-overlay" id="pacOverlay" hidden>
    <div class="pac-overlay-box">
      <p class="pac-overlay-title" id="pacOverlayTitle">게임 오버!</p>
      <p class="pac-overlay-score" id="pacOverlayScore"></p>
      <button type="button" class="pac-retry-btn" id="pacRetryBtn">🔄 다시 하기</button>
      <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록으로</a></p>
    </div>
  </div>
</main>

<script src="js/child-store.js?v=202608261345"></script>
<script src="js/pacman.js?v=202608261345"></script>
</body>
</html>
