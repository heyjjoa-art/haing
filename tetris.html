<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>테트리스 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202609031102">
<link rel="stylesheet" href="css/game-ui.css?v=202609031102">
<link rel="stylesheet" href="css/tetris.css?v=202609031102">
</head>
<body>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle" id="appSubtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="game-main">
  <h2 class="game-title">🧱 테트리스</h2>

  <div class="stage-tabs">
    <button type="button" class="stage-tab active" id="tetrisEasyTab" data-difficulty="easy">🟢 쉬움</button>
    <button type="button" class="stage-tab" id="tetrisNormalTab" data-difficulty="normal">🟡 보통</button>
    <button type="button" class="stage-tab" id="tetrisHardTab" data-difficulty="hard">🔴 어려움</button>
  </div>

  <div class="game-stats">
    <span class="game-stat--credits">🎮 기회 <strong id="tetrisCredits">0</strong>회</span>
    <span class="game-stat--best">🏆 최고 <strong id="tetrisBest">0</strong></span>
    <span>점수 <strong id="tetrisScore">0</strong></span>
    <span>레벨 <strong id="tetrisLevel">1</strong></span>
    <span>줄 <strong id="tetrisLines">0</strong></span>
  </div>

  <div class="tetris-board-wrap">
    <canvas id="tetrisBoard" class="tetris-board" width="280" height="560"></canvas>

    <div class="tetris-top-bar">
      <canvas id="tetrisNext" class="tetris-next" width="56" height="56"></canvas>
      <button type="button" class="game-icon-btn" id="tetrisPauseBtn" aria-label="일시정지">⏸</button>
    </div>

    <div class="game-veil" id="tetrisPauseVeil" hidden>⏸ 일시정지</div>
  </div>

  <!-- 양손 조작: 왼손은 왼쪽의 바로 내리기, 오른손은 오른쪽의 +자 방향 패드
       (위=회전, 아래=빨리 내려가기, 좌우=이동). -->
  <div class="tetris-controls-row">
    <button type="button" class="tetris-drop-btn" id="tetrisDropBtn">⤓<br>바로<br>내리기</button>
    <div class="game-dpad">
      <button type="button" class="game-dpad-btn game-dpad-up" id="tetrisRotateBtn" aria-label="회전">⟳</button>
      <button type="button" class="game-dpad-btn game-dpad-left" id="tetrisLeftBtn" aria-label="왼쪽으로">◀</button>
      <button type="button" class="game-dpad-btn game-dpad-right" id="tetrisRightBtn" aria-label="오른쪽으로">▶</button>
      <button type="button" class="game-dpad-btn game-dpad-down" id="tetrisDownBtn" aria-label="빨리 내려가기">▼</button>
    </div>
  </div>

  <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>

  <div class="game-overlay" id="tetrisOverlay" hidden>
    <div class="game-overlay-box">
      <p class="game-overlay-title" id="tetrisOverlayTitle">게임 오버!</p>
      <p class="game-overlay-desc" id="tetrisOverlayScore"></p>
      <button type="button" class="game-btn game-btn--primary" id="tetrisRetryBtn">🔄 다시 하기</button>
      <p class="game-overlay-note" id="tetrisOverlayNote" hidden>게임 기회를 모두 썼어요! 트로피 카드나 별 스티커를 더 모으면 기회가 또 생겨요.</p>
      <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js?v=202609031102"></script>
<script src="js/child-store.js?v=202609031102"></script>
<script src="js/admin-auth-store.js?v=202609031102"></script>
<script src="js/growth-store.js?v=202609031102"></script>
<script src="js/child-badge.js?v=202609031102"></script>
<script src="js/word-card-store.js?v=202609031102"></script>
<script src="js/progress-store.js?v=202609031102"></script>
<script src="journeys/js/stamp-store.js?v=202609031102"></script>
<script src="js/word-game-store.js?v=202609031102"></script>
<script src="js/game-ui.js?v=202609031102"></script>
<script src="js/tetris.js?v=202609031102"></script>
</body>
</html>
