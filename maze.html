<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>미로찾기 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202609031247">
<link rel="stylesheet" href="css/game-ui.css?v=202609031247">
<link rel="stylesheet" href="css/maze.css?v=202609031247">
</head>
<body>

<!-- 관리자 계정에서만 개발/테스트하는 게임 - 아직 아이 계정에는 열지 않는다.
     관리자로 로그인돼 있지 않으면 바로 홈으로 돌려보낸다(js/maze-gate.js). -->
<script src="js/admin-auth-store.js?v=202609031247"></script>
<script src="js/maze-gate.js?v=202609031247"></script>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle" id="appSubtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="game-main">
  <p class="game-dev-badge">🛠️ 개발 중 - 관리자 전용 (아직 아이 계정에는 안 보여요)</p>
  <h2 class="game-title">🐶 미로찾기</h2>

  <p class="maze-level-line">레벨 <strong id="mazeLevelNum">1</strong> / <span id="mazeLevelTotal">3</span></p>

  <div class="stage-select-wrap">
    <label class="stage-select-label" for="mazeLevelSelect">레벨 선택</label>
    <select class="stage-select" id="mazeLevelSelect"></select>
  </div>

  <div class="game-stats">
    <span class="game-stat--best">🏆 최고 <strong id="mazeBest">-</strong></span>
    <span>⏱ <strong id="mazeTimer">0:00.0</strong></span>
  </div>

  <div class="maze-board-wrap">
    <canvas id="mazeBoard" class="maze-board" width="320" height="320"></canvas>
  </div>

  <div class="game-pad">
    <div class="game-dpad">
      <button type="button" class="game-dpad-btn game-dpad-up" id="mazeUpBtn" aria-label="위로">▲</button>
      <button type="button" class="game-dpad-btn game-dpad-left" id="mazeLeftBtn" aria-label="왼쪽으로">◀</button>
      <button type="button" class="game-dpad-btn game-dpad-right" id="mazeRightBtn" aria-label="오른쪽으로">▶</button>
      <button type="button" class="game-dpad-btn game-dpad-down" id="mazeDownBtn" aria-label="아래로">▼</button>
    </div>
  </div>

  <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>

  <div class="game-overlay" id="mazeOverlay" hidden>
    <div class="game-overlay-box">
      <p class="game-overlay-title">🎉 도착했어요!</p>
      <p class="game-overlay-desc" id="mazeOverlayScore"></p>
      <button type="button" class="game-btn game-btn--primary" id="mazeNextBtn" hidden>➡️ 다음 레벨</button>
      <button type="button" class="game-btn" id="mazeRetryBtn">🔄 새 미로</button>
      <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>
    </div>
  </div>
</main>

<script src="js/child-store.js?v=202609031247"></script>
<script src="js/game-ui.js?v=202609031247"></script>
<script src="js/maze.js?v=202609031247"></script>
</body>
</html>
