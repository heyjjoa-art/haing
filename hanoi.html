<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>하노이의 탑 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202609111051">
<link rel="stylesheet" href="css/game-ui.css?v=202609111051">
<link rel="stylesheet" href="css/hanoi.css?v=202609111051">
</head>
<body>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle" id="appSubtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="game-main">
  <h2 class="game-title">🗼 하노이의 탑</h2>

  <p class="hanoi-level-line">레벨 <strong id="hanoiLevelNum">1</strong> / <span id="hanoiLevelTotal">6</span></p>

  <div class="stage-select-wrap" id="hanoiLevelChoice">
    <label class="stage-select-label" for="hanoiLevelSelect">레벨 선택</label>
    <select class="stage-select" id="hanoiLevelSelect"></select>
  </div>

  <div class="game-stats">
    <span class="game-stat--credits">🎮 기회 <strong id="hanoiCredits">0</strong>회</span>
    <span class="game-stat--best">🏆 최소 이동 <strong id="hanoiBest">-</strong></span>
    <span>⏱ <strong id="hanoiTimer">0:00</strong></span>
  </div>

  <p class="hanoi-status">
    <span>👣 이동 횟수 <strong id="hanoiMoves">0</strong>회</span>
    <span class="hanoi-status-sep">·</span>
    <span>최소 <strong id="hanoiMinMoves">0</strong>회</span>
  </p>

  <p class="hanoi-hint" id="hanoiHint">기둥을 눌러 원반을 고르고, 옮길 기둥을 다시 눌러보세요.</p>

  <div class="hanoi-board" id="hanoiBoard"></div>

  <button type="button" class="game-btn" id="hanoiRestartBtn">🔄 다시 시작</button>

  <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>

  <div class="game-overlay" id="hanoiOverlay" hidden>
    <div class="game-overlay-box">
      <p class="game-overlay-title" id="hanoiOverlayTitle">🎉 완성했어요!</p>
      <p class="game-overlay-desc" id="hanoiOverlayDesc"></p>
      <button type="button" class="game-btn game-btn--primary" id="hanoiNextBtn" hidden>➡️ 다음 단계</button>
      <button type="button" class="game-btn" id="hanoiRetryBtn">🔄 같은 단계 다시</button>
      <p class="game-overlay-note" id="hanoiOverlayNote" hidden>게임 기회를 모두 썼어요! 트로피 카드나 별 스티커를 더 모으면 기회가 또 생겨요.</p>
      <p class="back-link"><a href="wordcards.html?tab=games">← 게임 목록</a></p>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js?v=202609111051"></script>
<script src="js/child-store.js?v=202609111051"></script>
<script src="js/admin-auth-store.js?v=202609111051"></script>
<script src="js/growth-store.js?v=202609111051"></script>
<script src="js/child-badge.js?v=202609111051"></script>
<script src="js/word-card-store.js?v=202609111051"></script>
<script src="js/progress-store.js?v=202609111051"></script>
<script src="journeys/js/stamp-store.js?v=202609111051"></script>
<script src="js/word-game-store.js?v=202609111051"></script>
<script src="js/hanoi.js?v=202609111051"></script>
</body>
</html>
