<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 매칭 게임 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202608261345">
<link rel="stylesheet" href="css/memory.css?v=202608261345">
<link rel="stylesheet" href="css/word-card.css?v=202608261345">
</head>
<body>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle" id="appSubtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="memory-main">

  <div class="progress-line">
    전체 진행 <strong id="overallProgress">0</strong> / <strong id="overallTotal">20</strong> 단어
  </div>

  <div class="memory-toolbar">
    <div class="memory-stats">
      <span>시도 <strong id="moveCount">0</strong></span>
      <span>맞춘 짝 <strong id="matchCount">0</strong> / <strong id="totalPairs">0</strong></span>
    </div>
    <button type="button" id="restartBtn" class="secondary-btn">🔄 처음부터 다시</button>
  </div>

  <div class="memory-grid" id="memoryGrid"></div>

  <div class="win-banner" id="winBanner" hidden>
    <p id="roundWinText"></p>
    <button type="button" id="nextRoundBtn" class="secondary-btn">다음 세트 ▶</button>
  </div>

  <p class="back-link"><a href="index.html">← 홈으로</a></p>

</main>

<template id="cardTemplate">
  <button type="button" class="memory-card">
    <div class="card-inner">
      <div class="card-face card-back">?</div>
      <div class="card-face card-front"></div>
    </div>
  </button>
</template>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js?v=202608261345"></script>
<script src="js/child-store.js?v=202608261345"></script>
<script src="js/child-badge.js?v=202608261345"></script>
<script src="js/words-data.js?v=202608261345"></script>
<script src="js/elementary-words-data.js?v=202608261345"></script>
<script src="js/data-store.js?v=202608261345"></script>
<script src="js/progress-store.js?v=202608261345"></script>
<script src="js/word-card-store.js?v=202608261345"></script>
<script src="js/word-game-store.js?v=202608261345"></script>
<script src="js/praise-popup.js?v=202608261345"></script>
<script src="js/memory.js?v=202608261345"></script>
</body>
</html>
