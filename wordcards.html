<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 도감 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202608261303">
<link rel="stylesheet" href="css/word-card.css?v=202608261303">
</head>
<body>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle" id="appSubtitle">영어를 좋아하는</p>
</header>

<main class="wordcards-main">
  <nav class="wc-subtab-bar" role="tablist">
    <button type="button" class="wc-subtab-btn" id="wcTabWords" role="tab" aria-selected="true" aria-controls="wcGrid">단어 카드</button>
    <button type="button" class="wc-subtab-btn" id="wcTabTrophies" role="tab" aria-selected="false" aria-controls="wcGrid">트로피 카드</button>
    <button type="button" class="wc-subtab-btn" id="wcTabGames" role="tab" aria-selected="false" aria-controls="wcGamesPanel">게임</button>
  </nav>

  <p class="wc-stat" id="wcStatLine"><strong id="wcCount">0</strong><span id="wcCountLabel">개 모았어요</span></p>

  <div class="wc-empty" id="wcEmpty" hidden>
    <p id="wcEmptyLine1">아직 모은 단어 카드가 없어요.</p>
    <p id="wcEmptyLine2">1~4번 공부를 끝내면 카드를 한 장씩 받아요!</p>
  </div>

  <div class="wc-grid" id="wcGrid" hidden></div>

  <div class="wc-games-panel" id="wcGamesPanel" hidden>
    <p class="wc-stat">🎮 남은 게임 기회 <strong id="wcGameCredits">0</strong>회</p>
    <p class="wc-games-rule">트로피 카드 1장, 또는 별 스티커 20개를 모을 때마다<br>게임 기회가 3개 게임에 1회씩 생겨요!</p>

    <div class="wc-games-locked" id="wcGamesLocked" hidden>
      <p id="wcGamesLockedTitle">🔒 아직 게임 기회가 없어요.</p>
      <p id="wcGamesLockedHint">트로피 카드를 모으거나<br>복습에서 별 스티커를 모아보세요!</p>
    </div>

    <div class="wc-games-grid" id="wcGamesGrid" hidden>
      <button type="button" class="wc-game-card" id="wcGameTetris">
        <svg class="wc-game-icon" viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
          <rect x="2" y="2" width="17" height="17" rx="2" fill="#ffd93d"/>
          <rect x="2" y="2" width="17" height="3" rx="1.5" fill="rgba(255,255,255,0.35)"/>
          <rect x="2" y="16" width="17" height="3" rx="1.5" fill="rgba(0,0,0,0.18)"/>
          <rect x="21" y="2" width="17" height="17" rx="2" fill="#ffd93d"/>
          <rect x="21" y="2" width="17" height="3" rx="1.5" fill="rgba(255,255,255,0.35)"/>
          <rect x="21" y="16" width="17" height="3" rx="1.5" fill="rgba(0,0,0,0.18)"/>
          <rect x="2" y="21" width="17" height="17" rx="2" fill="#ffd93d"/>
          <rect x="2" y="21" width="17" height="3" rx="1.5" fill="rgba(255,255,255,0.35)"/>
          <rect x="2" y="35" width="17" height="3" rx="1.5" fill="rgba(0,0,0,0.18)"/>
          <rect x="21" y="21" width="17" height="17" rx="2" fill="#ffd93d"/>
          <rect x="21" y="21" width="17" height="3" rx="1.5" fill="rgba(255,255,255,0.35)"/>
          <rect x="21" y="35" width="17" height="3" rx="1.5" fill="rgba(0,0,0,0.18)"/>
        </svg>
        <span class="wc-game-title">테트리스</span>
        <span class="wc-game-credits" id="wcGameTetrisCredits">0회</span>
      </button>
      <button type="button" class="wc-game-card" id="wcGameSudoku">
        <svg class="wc-game-icon" viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
          <rect x="2" y="2" width="36" height="36" rx="4" fill="#e4d6c3"/>
          <rect x="2" y="2" width="36" height="36" rx="4" fill="none" stroke="#3a2e26" stroke-width="2"/>
          <rect x="2.5" y="2.5" width="11" height="11" fill="#fbf3e8"/>
          <rect x="14.5" y="2.5" width="11" height="11" fill="#ffffff"/>
          <rect x="26.5" y="2.5" width="11" height="11" fill="#fbf3e8"/>
          <rect x="2.5" y="14.5" width="11" height="11" fill="#ffffff"/>
          <rect x="14.5" y="14.5" width="11" height="11" fill="#ffffff"/>
          <rect x="26.5" y="14.5" width="11" height="11" fill="#ffffff"/>
          <rect x="2.5" y="26.5" width="11" height="11" fill="#fbf3e8"/>
          <rect x="14.5" y="26.5" width="11" height="11" fill="#ffffff"/>
          <rect x="26.5" y="26.5" width="11" height="11" fill="#fbf3e8"/>
          <text x="8" y="11.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#3a2e26">5</text>
          <text x="20" y="23.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#a85d2b">3</text>
          <text x="32" y="35.5" text-anchor="middle" font-size="9" font-weight="bold" fill="#3a2e26">9</text>
        </svg>
        <span class="wc-game-title">스도쿠</span>
        <span class="wc-game-credits" id="wcGameSudokuCredits">0회</span>
      </button>
      <button type="button" class="wc-game-card" id="wcGameCrossword">
        <svg class="wc-game-icon" viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
          <rect x="2" y="2" width="36" height="36" rx="4" fill="#e4d6c3"/>
          <rect x="2" y="2" width="36" height="36" rx="4" fill="none" stroke="#3a2e26" stroke-width="2"/>
          <rect x="2.5" y="2.5" width="8" height="8" fill="#ffffff"/>
          <rect x="11.5" y="2.5" width="8" height="8" fill="#ffffff"/>
          <rect x="20.5" y="2.5" width="8" height="8" fill="#fdf6ec"/>
          <rect x="29.5" y="2.5" width="8" height="8" fill="#ffffff"/>
          <rect x="2.5" y="11.5" width="8" height="8" fill="#ffffff"/>
          <rect x="11.5" y="11.5" width="8" height="8" fill="#fdf6ec"/>
          <rect x="20.5" y="11.5" width="8" height="8" fill="#ffffff"/>
          <rect x="29.5" y="11.5" width="8" height="8" fill="#ffffff"/>
          <rect x="2.5" y="20.5" width="8" height="8" fill="#ffffff"/>
          <rect x="11.5" y="20.5" width="8" height="8" fill="#ffffff"/>
          <rect x="20.5" y="20.5" width="8" height="8" fill="#fdf6ec"/>
          <rect x="29.5" y="20.5" width="8" height="8" fill="#ffffff"/>
          <rect x="2.5" y="29.5" width="8" height="8" fill="#fdf6ec"/>
          <rect x="11.5" y="29.5" width="8" height="8" fill="#ffffff"/>
          <rect x="20.5" y="29.5" width="8" height="8" fill="#ffffff"/>
          <rect x="29.5" y="29.5" width="8" height="8" fill="#ffffff"/>
        </svg>
        <span class="wc-game-title">가로세로 낱말</span>
        <span class="wc-game-credits" id="wcGameCrosswordCredits">0회</span>
      </button>
      <!-- 개발 중 - 관리자로 로그인했을 때만 js/wordcards.js가 hidden을 풀어준다. -->
      <button type="button" class="wc-game-card wc-game-dev" id="wcGameSmileyfind" hidden>
        <svg class="wc-game-icon" viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
          <circle cx="20" cy="20" r="17" fill="#ffd93d" stroke="#e0a72f" stroke-width="1.5"/>
          <circle cx="14" cy="17" r="2.2" fill="#3a2e26"/>
          <circle cx="26" cy="17" r="2.2" fill="#3a2e26"/>
          <path d="M12 24 Q20 31 28 24" stroke="#3a2e26" stroke-width="2.2" fill="none" stroke-linecap="round"/>
        </svg>
        <span class="wc-game-title">해피피 찾기</span>
        <span class="wc-game-credits">🛠️ 개발중</span>
      </button>
      <button type="button" class="wc-game-card wc-game-dev" id="wcGameHanoi" hidden>
        <svg class="wc-game-icon" viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
          <rect x="8" y="34" width="24" height="5" rx="2.5" fill="#b7a893"/>
          <rect x="18.5" y="6" width="3" height="29" rx="1.5" fill="#b7a893"/>
          <rect x="8" y="27" width="24" height="7" rx="3" fill="#ffe066"/>
          <rect x="11.5" y="20" width="17" height="7" rx="3" fill="#ffb454"/>
          <rect x="15" y="13" width="10" height="7" rx="3" fill="#ff8fa3"/>
        </svg>
        <span class="wc-game-title">하노이의 탑</span>
        <span class="wc-game-credits">🛠️ 개발중</span>
      </button>
      <button type="button" class="wc-game-card wc-game-dev" id="wcGameSnake" hidden>
        <svg class="wc-game-icon" viewBox="0 0 40 40" width="30" height="30" aria-hidden="true">
          <rect x="2" y="2" width="36" height="36" rx="6" fill="#2f3d2a"/>
          <rect x="8" y="8" width="7" height="7" rx="1.5" fill="#6bcb77"/>
          <rect x="16" y="8" width="7" height="7" rx="1.5" fill="#6bcb77"/>
          <rect x="24" y="8" width="7" height="7" rx="1.5" fill="#6bcb77"/>
          <rect x="24" y="16" width="7" height="7" rx="1.5" fill="#ffd93d"/>
          <circle cx="11.5" cy="28" r="3.5" fill="#ff6b6b"/>
        </svg>
        <span class="wc-game-title">스네이크</span>
        <span class="wc-game-credits">🛠️ 개발중</span>
      </button>
    </div>
  </div>

  <p class="back-link"><a href="index.html">← 홈으로</a></p>
</main>

<div class="wc-lightbox" id="wcLightbox">
  <button type="button" class="wc-lightbox-close" id="wcLightboxClose">✕ 닫기</button>
  <div id="wcLightboxBody"></div>
  <button type="button" class="secondary-btn wc-lightbox-replay" id="wcLightboxReplayBtn" hidden>🔊 다시 듣기</button>
</div>

<div class="wc-lightbox" id="wcUnitLightbox">
  <button type="button" class="wc-lightbox-close" id="wcUnitLightboxClose">✕ 닫기</button>
  <div class="wc-unit-detail">
    <p class="wc-unit-detail-title" id="wcUnitDetailTitle"></p>
    <div class="wc-grid" id="wcUnitDetailGrid"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js?v=202608261303"></script>
<script src="js/child-store.js?v=202608261303"></script>
<script src="js/admin-auth-store.js?v=202608261303"></script>
<script src="js/child-badge.js?v=202608261303"></script>
<script src="js/word-card-store.js?v=202608261303"></script>
<script src="js/word-card-view.js?v=202608261303"></script>
<script src="js/progress-store.js?v=202608261303"></script>
<script src="journeys/js/stamp-store.js?v=202608261303"></script>
<script src="js/word-game-store.js?v=202608261303"></script>
<script src="js/tts.js?v=202608261303"></script>
<script src="js/wordcards.js?v=202608261303"></script>
</body>
</html>
