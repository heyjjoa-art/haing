<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>단어 학습 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202609021515">
<link rel="stylesheet" href="css/flashcards.css?v=202609021515">
<link rel="stylesheet" href="css/word-card.css?v=202609021515">
</head>
<body>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle" id="appSubtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="flashcards-main">

  <div class="progress-line">
    학습 진행 <strong id="progressCount">0</strong> / <strong id="progressTotal">0</strong> 단어
  </div>

  <label class="speed-toggle">
    <input type="checkbox" id="speedModeToggle">
    ⚡ 스피드 모드 (자동으로 넘어가기)
  </label>

  <div class="flash-card">
    <div class="stage-dots">
      <span class="dot" id="dot1"></span>
      <span class="dot" id="dot2"></span>
      <span class="dot" id="dot3"></span>
    </div>

    <div class="flash-emoji" id="flashEmoji"></div>

    <p class="flash-question" id="flashQuestion"></p>

    <p class="flash-definition" id="flashDefinition" hidden></p>

    <p class="flash-word" id="flashWord" hidden></p>

    <p class="flash-meaning" id="flashMeaning" hidden></p>

    <button type="button" id="replayBtn" class="secondary-btn tts-replay-btn" hidden>🔊 다시 듣기</button>

    <button type="button" id="nextStageBtn" class="secondary-btn"></button>
  </div>

  <p class="back-link"><a href="index.html">← 홈으로</a></p>

</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js?v=202609021515"></script>
<script src="js/child-store.js?v=202609021515"></script>
<script src="js/growth-store.js?v=202609021515"></script>
<script src="js/child-badge.js?v=202609021515"></script>
<script src="js/words-data.js?v=202609021515"></script>
<script src="js/elementary-words-data.js?v=202609021515"></script>
<script src="js/data-store.js?v=202609021515"></script>
<script src="js/progress-store.js?v=202609021515"></script>
<script src="js/word-card-store.js?v=202609021515"></script>
<script src="js/praise-popup.js?v=202609021515"></script>
<script src="js/tts.js?v=202609021515"></script>
<script src="js/flashcards.js?v=202609021515"></script>
</body>
</html>
