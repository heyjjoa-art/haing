<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>스도쿠 - Haing</title>
<link rel="stylesheet" href="css/style.css?v=202608261303">
<link rel="stylesheet" href="css/sudoku.css?v=202608261303">
</head>
<body>

<header class="app-header">
  <h1><a href="index.html">Haing 🐣</a></h1>
  <p class="subtitle" id="appSubtitle">영어를 좋아하는</p>
  <a class="wordcard-link-btn" href="wordcards.html">
    <span class="wordcard-link-icon" aria-hidden="true">📔</span>
    <span class="wordcard-link-label">단어도감</span>
  </a>
</header>

<main class="sudoku-main">
  <p class="sudoku-credits">🎮 남은 게임 기회 <strong id="sudokuCredits">0</strong>회</p>
  <p class="sudoku-best">🏆 나의 최고 기록 <strong id="sudokuBest">-</strong> · ⏱ <strong id="sudokuTimer">0:00</strong></p>

  <div class="stage-tabs">
    <button type="button" class="stage-tab active" id="sudokuEasyTab" data-level="easy">🟢 쉬운 단계</button>
    <button type="button" class="stage-tab" id="sudokuMediumTab" data-level="medium">🟡 중간 단계</button>
    <button type="button" class="stage-tab" id="sudokuHardTab" data-level="hard">🔴 어려운 단계</button>
  </div>

  <p class="sudoku-mistakes">틀린 칸 <strong id="sudokuConflicts">0</strong>개</p>

  <div class="sudoku-board" id="sudokuBoard"></div>

  <div class="sudoku-numpad" id="sudokuNumpad">
    <button type="button" class="sudoku-num-btn" data-num="1">1</button>
    <button type="button" class="sudoku-num-btn" data-num="2">2</button>
    <button type="button" class="sudoku-num-btn" data-num="3">3</button>
    <button type="button" class="sudoku-num-btn" data-num="4">4</button>
    <button type="button" class="sudoku-num-btn" data-num="5">5</button>
    <button type="button" class="sudoku-num-btn" data-num="6">6</button>
    <button type="button" class="sudoku-num-btn" data-num="7">7</button>
    <button type="button" class="sudoku-num-btn" data-num="8">8</button>
    <button type="button" class="sudoku-num-btn" data-num="9">9</button>
    <button type="button" class="sudoku-num-btn sudoku-erase-btn" data-num="0">지우개</button>
  </div>

  <p class="back-link"><a href="wordcards.html">← 도감으로</a></p>

  <div class="sudoku-overlay" id="sudokuOverlay" hidden>
    <div class="sudoku-overlay-box">
      <p class="sudoku-overlay-title">🎉 완성했어요!</p>
      <p class="sudoku-overlay-desc" id="sudokuOverlayDesc"></p>
      <button type="button" class="wc-popup-btn" id="sudokuRetryBtn">🔄 새 퍼즐</button>
      <p class="sudoku-overlay-note" id="sudokuOverlayNote" hidden>게임 기회를 모두 썼어요! 트로피 카드나 별 스티커를 더 모으면 기회가 또 생겨요.</p>
      <p class="back-link"><a href="wordcards.html">← 도감으로</a></p>
    </div>
  </div>
</main>

<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
<script src="js/firebase-init.js?v=202608261303"></script>
<script src="js/child-store.js?v=202608261303"></script>
<script src="js/admin-auth-store.js?v=202608261303"></script>
<script src="js/child-badge.js?v=202608261303"></script>
<script src="js/word-card-store.js?v=202608261303"></script>
<script src="js/progress-store.js?v=202608261303"></script>
<script src="journeys/js/stamp-store.js?v=202608261303"></script>
<script src="js/word-game-store.js?v=202608261303"></script>
<script src="js/sudoku.js?v=202608261303"></script>
</body>
</html>
